<link rel="stylesheet" href="style.css">
<style>
  .embed-stage { max-width: 480px; margin: 0 auto 32px; }

    width: 100%;
    border: 1px solid var(--line);

    padding: 10px;

  }
  .caption-note code {

    padding: 1px 5px;
    border: 1px solid var(--line);

  }
</style>
</head>

<div class="wrap">

  <div class="embed-stage">
    <div class="embed-frame">
      <iframe
        data-testid="embed-iframe"
