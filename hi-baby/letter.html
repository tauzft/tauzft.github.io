<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a letter for you — for my yelo</title>
<link rel="stylesheet" href="style.css">
<style>
  .a4-stage {
    display: flex;
    justify-content: center;
    margin-bottom: 32px;
  }
  .a4 {
    width: 100%;
    max-width: 440px;
    aspect-ratio: 210 / 297; /* true A4 ratio */
    background: var(--paper);
    border: 1px solid var(--line);
    position: relative;
    box-shadow: 0 18px 40px rgba(42,51,64,0.10), 0 2px 6px rgba(42,51,64,0.06);
  }
  .a4::before {
    content: '';
    position: absolute;
    inset: 14px;
    border: 1px dashed var(--line);
    z-index: 2;
    pointer-events: none;
  }
  .a4 img {
    position: absolute;
    inset: 14px;
    width: calc(100% - 28px);
    height: calc(100% - 28px);
    object-fit: cover;
    object-position: center;
    display: block;
    opacity: 1;
    transition: opacity 0.35s ease;
  }
  .a4 img.hidden { display: none; }
  .a4 img.fading { opacity: 0; }

  .sheet-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .flip-btn {
    font-family: 'EB Garamond', serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--harbor-deep);
    background: none;
    border: 1px solid var(--harbor);
    padding: 10px 18px;
    cursor: pointer;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .flip-btn:hover { background: var(--harbor); color: var(--paper); }
  .flip-btn:disabled {
    opacity: 0.35;
    cursor: default;
    background: none;
    color: var(--harbor-deep);
  }

  .dots { display: flex; gap: 8px; }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.3s ease;
  }
  .dot.active { background: var(--harbor-deep); }

  .sheet-label {
    text-align: center;
    margin-top: 22px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--slate);
  }
</style>
</head>
<body>
<div class="wrap">

  <a class="back-link" href="index.html">&larr; back home</a>

  <p class="page-title">a letter for you</p>
  <p class="page-sub">hello, my love!</p>

  <div class="a4-stage">
    <div class="a4">
      <img id="sheet1" src="/hi-baby/img/letter.png" alt="A Not So Love Letter">
      <img id="sheet2" class="hidden" src="/hi-baby/img/abt-my-bf.png" alt="About My Boyfriend">
    </div>
  </div>

  <div class="sheet-controls">
    <button class="flip-btn" id="prevBtn" disabled>&larr; back</button>
    <div class="dots">
      <span class="dot active" id="dot1"></span>
      <span class="dot" id="dot2"></span>
    </div>
    <button class="flip-btn" id="nextBtn">next &rarr;</button>
  </div>

  <p class="sheet-label" id="sheetLabel">a not so love letter</p>

</div>

<script>
  const sheet1 = document.getElementById('sheet1');
  const sheet2 = document.getElementById('sheet2');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const dot1 = document.getElementById('dot1');
  const dot2 = document.getElementById('dot2');
  const label = document.getElementById('sheetLabel');

  const labels = { 1: 'a not so love letter', 2: 'about my boyfriend' };

  function goToPage(page) {
    const showing = page === 2 ? sheet2 : sheet1;
    const hiding = page === 2 ? sheet1 : sheet2;

    hiding.classList.add('fading');
    setTimeout(() => {
      hiding.classList.add('hidden');
      hiding.classList.remove('fading');
      showing.classList.add('fading');
      showing.classList.remove('hidden');
      requestAnimationFrame(() => showing.classList.remove('fading'));
    }, 300);

    label.textContent = labels[page];
    nextBtn.disabled = page === 2;
    prevBtn.disabled = page === 1;
    dot1.classList.toggle('active', page === 1);
    dot2.classList.toggle('active', page === 2);
  }

  nextBtn.addEventListener('click', () => goToPage(2));
  prevBtn.addEventListener('click', () => goToPage(1));
</script>
</body>
</html>
